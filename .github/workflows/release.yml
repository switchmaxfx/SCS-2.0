# Publishing a release on GitHub (tag like v2.01) builds SCS.exe from that exact tag on
# GitHub's Windows runners and attaches it to the release, plus a SHA-256 checksum.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v2.01"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish SCS.csproj -c Release -o out
      - name: SHA-256 of the exe
        shell: pwsh
        run: (Get-FileHash out/SCS.exe -Algorithm SHA256).Hash.ToLower() + "  SCS.exe" | Out-File -Encoding ascii out/SCS.exe.sha256
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.name }}" out/SCS.exe out/SCS.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
