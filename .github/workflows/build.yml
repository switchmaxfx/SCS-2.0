# Optional: push this folder to a GitHub repo and every push builds SCS.exe for you
# (Actions tab -> latest run -> Artifacts -> SCS).
name: build
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish SCS.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SCS
          path: publish/SCS.exe
